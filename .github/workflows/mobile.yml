name: Mobile (Capacitor)

# Builds the DeckBook mobile apps from the shared Vite web build.
#  - Android: an installable debug APK (release/store builds need signing keys).
#  - iOS: an unsigned build to validate the Xcode project (a signed .ipa for
#    the App Store needs an Apple Developer certificate + provisioning profile).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: deckbook-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - uses: actions/upload-artifact@v7
        with:
          name: deckbook-ios-app-unsigned
          path: ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

  # Signed Play Store bundle — only on a version tag, and only when the
  # signing secrets are configured. Attaches the .aab to the tag's release.
  #
  # Required repository secrets:
  #   DECKBOOK_KEYSTORE_BASE64  base64 of your .jks (e.g. `base64 -w0 key.jks`)
  #   DECKBOOK_STORE_PASSWORD   keystore password
  #   DECKBOOK_KEY_ALIAS        key alias
  #   DECKBOOK_KEY_PASSWORD     key password
  android-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.DECKBOOK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DECKBOOK_KEYSTORE_BASE64 is not set. Add the signing secrets to build a release .aab."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.DECKBOOK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deckbook-release.jks"

      - name: Build signed release bundle
        working-directory: android
        env:
          DECKBOOK_KEYSTORE: ${{ runner.temp }}/deckbook-release.jks
          DECKBOOK_STORE_PASSWORD: ${{ secrets.DECKBOOK_STORE_PASSWORD }}
          DECKBOOK_KEY_ALIAS: ${{ secrets.DECKBOOK_KEY_ALIAS }}
          DECKBOOK_KEY_PASSWORD: ${{ secrets.DECKBOOK_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: deckbook-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach .aab to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: android/app/build/outputs/bundle/release/*.aab
