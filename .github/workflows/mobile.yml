name: Mobile (Capacitor)

# Builds the DeckBook mobile apps from the shared Vite web build.
#  - Android: an installable debug APK (release/store builds need signing keys).
#  - iOS: an unsigned build to validate the Xcode project (a signed .ipa for
#    the App Store needs an Apple Developer certificate + provisioning profile).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: deckbook-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - uses: actions/upload-artifact@v7
        with:
          name: deckbook-ios-app-unsigned
          path: ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
